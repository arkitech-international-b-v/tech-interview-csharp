<div class="dashboard-container">
  <mat-toolbar color="primary" class="toolbar">
    <div class="logo-container">
      <span class="logo"
        ><img
          src="https://arkitech.eu/wp-content/uploads/2025/01/WhiteArkitechLogo-2048x289.png"
          height="28"
          width="204"
      /></span>
    </div>
  </mat-toolbar>

  <!-- Main Content -->
  <div class="content">
    <div class="dashboard-header">
      <h1>Average Temperatures</h1>
      <span class="last-updated">Average in last 24hrs</span>
    </div>
    <mat-grid-list cols="3" rowHeight="2:1">
      <mat-grid-tile>
        <mat-card class="temperature-card">
          <mat-card-header>
            <mat-card-title>Bridge</mat-card-title>
            <mat-card-subtitle>Average Temperature</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <div class="temperature-value">
              <span class="value">10</span>
              <span class="unit">°C</span>
            </div>
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>
      <mat-grid-tile>
        <mat-card class="temperature-card">
          <mat-card-header>
            <mat-card-title>Engine Room</mat-card-title>
            <mat-card-subtitle>Average Temperature</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <div class="temperature-value">
              <span class="value">10</span>
              <span class="unit">°C</span>
            </div>
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>
      <mat-grid-tile>
        <mat-card class="temperature-card">
          <mat-card-header>
            <mat-card-title>Crew Quarters</mat-card-title>
            <mat-card-subtitle>Average Temperature</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <div class="temperature-value">
              <span class="value">10</span>
              <span class="unit">°C</span>
            </div>
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>
    </mat-grid-list>

    <h4>Sample Data:</h4>
    <code>
      @if (data$ | async; as data) {
      <pre>{{ data | json }}</pre>
      } 
    </code>
  </div>
</div>

<router-outlet />
